<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with subtle gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="checkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c757d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#495057;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer circle background -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGradient)" stroke="#adb5bd" stroke-width="2"/>
  
  <!-- Inner checkbox square -->
  <rect x="32" y="32" width="64" height="64" rx="8" ry="8" 
        fill="none" stroke="#6c757d" stroke-width="4"/>
  
  <!-- Checkmark -->
  <path d="M 45 64 L 56 75 L 83 48" 
        stroke="url(#checkGradient)" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"/>
  
  <!-- Small "GS" text at bottom -->
  <text x="64" y="110" text-anchor="middle" 
        font-family="Arial, sans-serif" 
        font-size="14" 
        font-weight="bold" 
        fill="#495057">GS</text>
</svg>
